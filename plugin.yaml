name: local-scout
version: "1.7.5"
description: "Local privacy and safety layer: masks detected personal data and secrets in prompts, tool and MCP output and title calls in milliseconds, flags prompt injection, offers optional calibrated local triage, and shows what happened in local Insights"
requires_hermes: ">=0.23.0,<0.24.0"
manifest_version: 2
license: MIT
provides_tools:
  - scout_handle
  - scout_calibrate
  - scout_inspect
  - scout_recipes
  - scout_choose
  - scout_train
  - scout_predict
  - scout_report
  - scout_calculate
provides_hooks:
  - post_tool_call
  - pre_api_request
  - pre_auxiliary_call
  - post_api_request
  - post_auxiliary_call
  - transform_llm_output
  - transform_tool_result
  - transform_terminal_output
provides_middleware:
  - llm_request
  - llm_execution
capabilities: []
requires_env: []
python_dependencies:
  - "numpy>=1.24,<3"
  - "scipy>=1.11,<2"
  - "scikit-learn>=1.3,<2"
  - "PyYAML>=6.0,<7"
  - "threadpoolctl>=3.1,<4"
